<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-Amp</title>
<link rel="icon" href="/favicon.svg">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1a24; font: 13px/1.5 Arial, sans-serif; }
  .box { width: min(420px, 90vw); background: #bdbdc8; box-shadow: inset -1px -1px #5a5a68, inset 1px 1px #fff; padding: 3px; }
  .title { background: linear-gradient(#21216b, #3c3ca8); color: #fff; font-weight: bold; padding: 3px 6px; letter-spacing: 1px; font-size: 11px; }
  .body { background: #000; color: #00ff00; padding: 18px; margin-top: 3px; }
  .body.bad { color: #ff6060; }
  p { margin: 0 0 8px; }
  .dim { color: #7fbf7f; }
</style>
</head>
<body>
<div class="box">
  <div class="title">G-AMP</div>
  <div class="body" id="msg"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const service = q.get("service") || "The service";
  const error = q.get("error");
  const msg = document.getElementById("msg");
  const p = (text, cls) => { const el = document.createElement("p"); el.textContent = text; if (cls) el.className = cls; msg.append(el); };
  if (error) {
    msg.classList.add("bad");
    p(`${service} didn't connect.`);
    p(error);
    p("Go back to G-Amp and try again from Settings.", "dim");
  } else {
    p(`${service} is connected.`);
    p("You can close this tab and go back to G-Amp.", "dim");
  }
</script>
</body>
</html>

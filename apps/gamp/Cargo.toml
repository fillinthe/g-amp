[package]
name = "gamp"
description = "G-Amp: the classic Winamp player, rebuilt natively in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gamp-audio = { path = "../../crates/gamp-audio" }
gamp-core = { path = "../../crates/gamp-core" }
gamp-skin = { path = "../../crates/gamp-skin" }
gamp-ui = { path = "../../crates/gamp-ui" }
gamp-vis = { path = "../../crates/gamp-vis" }
anyhow = "1.0.104"
env_logger = "0.11.11"
lofty = "0.22"
log = "0.4.34"
rfd = "0.17"
softbuffer = "0.4"
winit = "0.30"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
axum = "0.8"
symphonia = "0.5"
serde_json = "1.0.154"
arboard = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# Media keys and Now Playing (zbus: pure Rust on Linux, no libdbus).
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"

[package]
name = "gamp"
description = "Gamp: the classic Winamp player, rebuilt natively in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gamp-audio = { path = "../../crates/gamp-audio" }
gamp-core = { path = "../../crates/gamp-core" }
gamp-skin = { path = "../../crates/gamp-skin" }
gamp-ui = { path = "../../crates/gamp-ui" }
gamp-vis = { path = "../../crates/gamp-vis" }
anyhow = "1.0.104"
env_logger = "0.11.11"
lofty = "0.22"
log = "0.4.34"
rfd = "0.17"
softbuffer = "0.4"
winit = "0.30"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
axum = "0.8"
symphonia = "0.5"
serde_json = "1.0.154"
arboard = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# Media keys and Now Playing (zbus: pure Rust on Linux, no libdbus).
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1.34"

# `cargo packager --release` from this folder: .app/.dmg, NSIS installer,
# .deb and AppImage, depending on the system it runs on.
[package.metadata.packager]
productName = "Gamp"
identifier = "co.fillinthe.gamp"
description = "The classic Winamp-style music player, rebuilt in Rust"
authors = ["Fill in the Blank, LLC"]
publisher = "Fill in the Blank, LLC"
copyright = "© 2026 Fill in the Blank, LLC"
category = "Music"
icons = ["../../assets/logo/gamp.icns", "../../assets/logo/gamp.ico", "../../assets/logo/gamp-icon-256.png"]
outDir = "../../target/packages"
beforePackagingCommand = "cargo build --release -p gamp"
binaries = [{ path = "gamp", main = true }]

[[package.metadata.packager.fileAssociations]]
extensions = ["mp3", "flac", "m4a", "aac", "ogg", "oga", "wav", "aif", "aiff", "m3u", "m3u8", "pls"]
description = "Audio"
role = "viewer"

[[package.metadata.packager.fileAssociations]]
extensions = ["wsz"]
description = "Winamp skin"
role = "viewer"

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"
infoPlistPath = "packaging/Info.plist"

[package.metadata.packager.deb]
depends = ["libasound2 | libasound2t64"]
section = "sound"

[package.metadata.packager.nsis]
installMode = "currentUser"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"] }

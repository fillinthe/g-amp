[package]
name = "gamp-core"
description = "Gamp's music sources, library, Spotify, SoundCloud and local server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
# The local server (the iPhone app's page and --server mode).
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
# webpki roots rather than the OS store, so TLS works the same everywhere.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream", "http2"] }
# Tags and durations for MP3, FLAC, M4A, OGG, Opus and WAV.
lofty = "0.22"
walkdir = "2"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
urlencoding = "2"
# Spotify playback (Premium).
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
# Liked Songs, playlists and search read through the player session: no developer app.
librespot-protocol = "0.8"
protobuf = "3"
protobuf-json-mapping = "3"
# WebDAV listings, podcast feeds and DLNA servers speak XML.
roxmltree = "0.21"
md-5 = "0.10"
hex = "0.4"
if-addrs = "0.15.0"
socket2 = "0.5"

[dev-dependencies]
env_logger = "0.11"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo test --workspace --locked
      - run: cargo build -p gamp --locked
      # The real app, headless: plays a file, scans a folder, plays it
      # through the library and local server, seeks, draws every window.
      - run: target/debug/gamp${{ runner.os == 'Windows' && '.exe' || '' }} --selftest

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gamp-ios/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/gamp-ios
      - run: npm run build
        working-directory: apps/gamp-ios
      - run: cargo test --workspace --lib --locked
      - run: cargo build --locked -p gamp-ios
      # Runs the real app's server on this OS: page, scan, playback, safety.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/smoke.py target/debug/gamp-ios${{ runner.os == 'Windows' && '.exe' || '' }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo test --lib --locked
        working-directory: src-tauri
      - run: cargo build --locked
        working-directory: src-tauri
      # Runs the real app's server on this OS: page, scan, playback, safety.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/smoke.py src-tauri/target/debug/g-amp${{ runner.os == 'Windows' && '.exe' || '' }}
